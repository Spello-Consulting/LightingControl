[project]
name = "LightingControl"
version = "2.1.1"
description = "Control multiple lights using Shelly smart switches"
readme = "README.md"
requires-python = ">=3.13"
service_name="LightingControl"
launch_path="src/main.py"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "mergedeep>=1.3.4",
    "python-dotenv>=1.0.0",
    "sc-foundation-services>=3.3.0",
    "sc-smart-device>=3.2.1",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

